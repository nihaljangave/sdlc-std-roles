openapi: 3.0.3
info:
  title: B2B Wholesale Ordering API
  description: Fast-paced prototype API contract for client distributor ordering and inventory sync.
  version: 1.0.0
servers:
  - url: https://staging-api.distributor.com/v1
    description: Staging Sandbox
  - url: https://api.distributor.com/v1
    description: Production Environment

paths:
  /health/live:
    get:
      summary: Liveness Probe
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/ready:
    get:
      summary: Readiness Probe
      responses:
        '200':
          description: DB and Redis connection verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  database:
                    type: string
                    example: connected
                  redis:
                    type: string
                    example: connected

  /orders:
    post:
      summary: Submit a bulk wholesale order
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    OrderCreateRequest:
      type: object
      required:
        - distributor_id
        - line_items
      properties:
        distributor_id:
          type: string
          example: dist_9941
        line_items:
          type: array
          items:
            type: object
            required:
              - sku
              - quantity
            properties:
              sku:
                type: string
                example: PROD-SKU-100
              quantity:
                type: integer
                minimum: 1
                example: 50

    OrderResponse:
      type: object
      properties:
        order_id:
          type: string
          example: ord_wholesale_88291
        status:
          type: string
          example: CONFIRMED
        total_amount:
          type: number
          example: 4999.50
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_SKU
            message:
              type: string
              example: Requested SKU does not exist in active catalog.

