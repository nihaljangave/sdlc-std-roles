name: CI & Compliance Gate

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-hygiene:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Secret Leak Detection (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Linting & Code Style
        run: npm run lint --if-present

      - name: Type Checking
        run: npm run typecheck --if-present

  automated-testing:
    name: Unit & Integration Tests (Coverage >= 80%)
    runs-on: ubuntu-latest
    needs: code-hygiene
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite with Coverage
        run: npm test -- --coverage --ci --maxWorkers=2 --if-present

  doc-as-code-sync:
    name: Verify Documentation Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify OpenAPI Spec Sync (If applicable)
        run: |
          if npm run | grep -q "docs:generate-openapi"; then
            npm run docs:generate-openapi
            git diff --exit-code docs/api/openapi.yaml || (echo "ERROR: OpenAPI documentation is out of sync with code! Run npm run docs:generate-openapi and commit the changes." && exit 1)
          else
            echo "No docs:generate-openapi script found, skipping API schema sync check."
          fi

