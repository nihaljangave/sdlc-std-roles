name: Markdown Links & Quality Verification

on:
  pull_request:
    paths:
      - '**.md'
  push:
    branches: [main, master]
    paths:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-links:
    name: Verify Markdown Link Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Markdown Link Integrity Check
        run: make test-links
